services:
  postgres:
    image: postgres:16-alpine
    container_name: besmachot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: besmachot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - besmachot_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d besmachot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  besmachot_pgdata:
